
<!DOCTYPE html>
<html lang="en">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b35">
  <title>Travel Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
</head>
<body>
  <header class="topbar">
    <h2>✦ Travel Hub</h2>
    <span id="status">Getting started</span>
  </header>

  <main class="container">
    <section id="setup" class="panel">
      <h1>Welcome to Travel Hub</h1>
      <p>Your trips, plans, and adventures together.</p>
      <p>We're setting up your travel workspace.</p>
    </section>

    <section id="auth" class="panel hidden">
      <h1>Welcome back</h1>

      <label>Email
        <input id="email" type="email" placeholder="you@example.com">
      </label>

      <label>Password
        <input id="password" type="password" placeholder="Password">
      </label>

      <button id="signin">Sign in</button>
      <button id="signup">Create account</button>
      <button id="resetpassword">Forgot password?</button>

      <p id="authmsg"></p>

      <div id="password-reset-panel" class="hidden">
        <h2>Choose a new password</h2>

        <label>New password
          <input id="newpassword" type="password" placeholder="New password">
        </label>

        <button id="savepassword">Save new password</button>
        <p id="resetmsg"></p>
      </div>
    </section>

    <section id="app" class="hidden">
      <h1>Your trips</h1>

      <section class="panel">
        <h2>Create a trip</h2>

        <input id="tripname" placeholder="Trip name">
        <input id="destination" placeholder="Destination">

        <label>Start date
          <input id="startdate" type="date">
        </label>

        <label>End date
          <input id="enddate" type="date">
        </label>

        <button id="create">Create trip</button>
        <p id="tripmsg"></p>
      </section>

      <div id="trips"></div>
      <button id="signout">Sign out</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    window.addEventListener("error", function(event) {
      const status = document.getElementById("status");

      if (status) {
        status.textContent =
          "JavaScript error: " +
          (event.message || "Unable to load script");
      }
    });

    window.addEventListener("unhandledrejection", function(event) {
      const status = document.getElementById("status");

      if (status) {
        status.textContent =
          "Startup error: " +
          (event.reason?.message || event.reason || "Unknown error");
      }
    });
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
     <script src="theme.js"></script>
      <script src="autocomplete.js"></script>
  <script src="documents.js"></script>
      <script src="photos.js"></script>
  <script src="app.js"></script>
      <script src="members.js"></script>
      <script src="budget.js"></script>
      <script src="overview.js"></script>
      <script src="weather.js"></script>
      <script src="packing.js"></script>
      <script src="resume.js"></script>
</body>
</html>
